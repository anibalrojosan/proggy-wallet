{% extends 'base.html' %}

{% block title %}Login - Proggy Wallet{% endblock %}

{% block content %}
<div class="container">
    <div class="row min-vh-75 align-items-center justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h2>🐧 Proggy Wallet</h2>
                        <p class="text-muted">Please login to your account</p>
                    </div>

                    <!-- Login Form -->
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="id_username" class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" id="id_username" placeholder="Enter your username" required >
                        </div>
                        <div class="mb-3">
                            <label for="id_password" class="form-label">Password</label>
                            <input type="password" name="password" class="form-control" id="id_password" placeholder="Enter your password" required >
                        </div>
                        
                        <!-- Error Message Container -->
                        {% if form.errors %}
                        <div class="alert alert-danger" role="alert">
                            Your username and password didn't match. Please try again.
                        </div>
                        {% endif %}
                        
                        <button type="submit" class="btn btn-primary w-100 btn-lg mt-3">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
