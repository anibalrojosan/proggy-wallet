{% extends 'base.html' %}

{% block title %}Deposit - Proggy Wallet{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-cash-stack display-1 text-success"></i>
                        <h2 class="mt-2">Deposit Funds</h2>
                        <p class="text-muted">Enter the amount you want to add to your account.</p>
                    </div>

                    <!-- Current Balance Display -->
                    <div class="alert alert-info text-center" role="alert">
                        Current Balance: <strong id="currentBalanceDisplay">${{ user.account.balance }}</strong>
                    </div>

                    <!-- Deposit Form -->
                    <form method="post" id="depositForm">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="depositAmount" class="form-label">Amount ($)</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text">$</span>
                                <input type="number" name="amount" class="form-control" id="depositAmount" step="0.01" placeholder="0.00" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success btn-lg w-100" id="btnDeposit">
                            Confirm Deposit
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
